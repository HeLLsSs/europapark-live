# Europa-Park Live dans Docker : nginx en HTTP sur le port 8080, PHP-FPM sur 127.0.0.1:9000.
#
# Mêmes règles que deploy/nginx/europapark.conf, sans TLS : place le conteneur derrière
# ton propre reverse proxy (Caddy, Traefik, nginx…) qui fournit le HTTPS.
# HTTPS obligatoire (GPS, notifications, installation sur l'écran d'accueil).
#
# Racine  : /var/www/europapark/www
# PHP-FPM : seul api.php est exécutable
# Données : /var/www/europapark/www/data (volume), jamais servies
#
user nginx;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout combined;

    # Le reverse proxy termine le HTTPS : on transmet son schéma à PHP
    map $http_x_forwarded_proto $forwarded_https {
        https   on;
        default "";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /var/www/europapark/www;
        index index.html;
        charset utf-8;

        # Redirections relatives : l'adresse publique est celle du reverse proxy, pas :8080
        absolute_redirect off;

        # Pas d'upload : on garde la limite basse
        client_max_body_size 1M;

        # En-têtes de sécurité. Aucun « add_header » dans les locations ci-dessous,
        # sinon nginx n'hériterait plus de ceux-ci (le cache passe par « expires »).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

        gzip on;
        gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
        gzip_min_length 1024;

        # Protection optionnelle (les profils n'ont pas de mot de passe) : un mot de passe
        # commun pour tout le site. Fichier créé sur l'hôte avec : htpasswd -c ./europapark.htpasswd groupe
        # puis monté dans le conteneur (voir docker-compose.yml) sur /etc/nginx/europapark.htpasswd.
        # La collecte cron passe par PHP en ligne de commande, elle n'est pas concernée ;
        # « satisfy any » + « allow 127.0.0.1 » laissent passer le healthcheck Docker.
        #satisfy any;
        #allow 127.0.0.1;
        #deny all;
        #auth_basic "Europa-Park Live";
        #auth_basic_user_file /etc/nginx/europapark.htpasswd;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Page et service worker toujours revalidés : une mise à jour de l'image est vue tout de suite
        location ~ ^/(index\.html|sw\.js)$ {
            expires -1;
        }

        # « webmanifest » est absent de mime.types
        location = /manifest.webmanifest {
            default_type application/manifest+json;
            expires -1;
        }

        location ~* \.(png|svg)$ {
            expires 7d;
        }

        # Relais : le seul script PHP exécuté
        location = /api.php {
            try_files $uri =404;

            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_param HTTPS           $forwarded_https if_not_empty;
            fastcgi_read_timeout 30s;
        }

        # Tout autre .php : refusé (pas de chemin arbitraire exécuté par PHP-FPM)
        location ~ \.php$ {
            return 404;
        }

        # Cache, historique, profils et clés écrits par api.php
        location ^~ /data/ {
            deny all;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
