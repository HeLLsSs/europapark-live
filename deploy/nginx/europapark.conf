# Europa-Park Live : page mobile + relais PHP (PHP-FPM 8.x)
#
# À adapter : server_name, chemins des certificats, socket PHP-FPM, chemin du dépôt.
#
# Dépôt   : /var/www/europapark (git clone)
# Racine  : /var/www/europapark/www
# PHP-FPM : seul api.php est exécutable
# Données : /var/www/europapark/www/data (cache, historique, profils), jamais servies
#
# La page doit être joignable depuis Internet : elle sert depuis le parc, en 4G.
# HTTPS obligatoire (GPS, notifications, installation sur l'écran d'accueil).
#
server {
    listen 80;
    listen [::]:80;
    server_name europapark.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name europapark.example.com;
    access_log /var/log/nginx/europapark.access.log combined;
    error_log  /var/log/nginx/europapark.error.log;

    # Certificat (par exemple Let's Encrypt via certbot)
    ssl_certificate     /etc/letsencrypt/live/europapark.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/europapark.example.com/privkey.pem;

    root /var/www/europapark/www;
    index index.html;
    charset utf-8;

    # Pas d'upload : on garde la limite basse
    client_max_body_size 1M;

    # En-têtes de sécurité. Aucun « add_header » dans les locations ci-dessous,
    # sinon nginx n'hériterait plus de ceux-ci (le cache passe par « expires »).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Protection optionnelle (les profils n'ont pas de mot de passe) : un mot de passe
    # commun pour tout le site. Fichier créé avec : sudo htpasswd -c /etc/nginx/europapark.htpasswd groupe
    # La collecte cron passe par PHP en ligne de commande, elle n'est pas concernée.
    #auth_basic "Europa-Park Live";
    #auth_basic_user_file /etc/nginx/europapark.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Page, textes et service worker toujours revalidés : une mise à jour (git pull) est vue tout de suite
    location ~ ^/(index\.html|i18n\.js|sw\.js)$ {
        expires -1;
    }

    # « webmanifest » est absent de mime.types
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location ~* \.(png|svg)$ {
        expires 7d;
    }

    # Relais : le seul script PHP exécuté
    location = /api.php {
        try_files $uri =404;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 30s;
    }

    # Tout autre .php : refusé (pas de chemin arbitraire exécuté par PHP-FPM)
    location ~ \.php$ {
        return 404;
    }

    # Cache, historique, profils et clés écrits par api.php
    location ^~ /data/ {
        deny all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
